<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Tinto logo: 5-cycle with a valid 3-coloring">
  <title>Tinto</title>
  <!-- Pentagon (5-cycle) with a proper 3-coloring: R, G, B, R, G. -->
  <!-- Vertex positions, regular pentagon centered at (50, 50), radius 35. -->
  <g stroke="#2f3437" stroke-width="3" stroke-linecap="round">
    <line x1="50"   y1="15"   x2="16.7" y2="39.2"/>
    <line x1="16.7" y1="39.2" x2="29.4" y2="78.3"/>
    <line x1="29.4" y1="78.3" x2="70.6" y2="78.3"/>
    <line x1="70.6" y1="78.3" x2="83.3" y2="39.2"/>
    <line x1="83.3" y1="39.2" x2="50"   y2="15"/>
  </g>
  <g stroke="#2f3437" stroke-width="2.5">
    <circle cx="50"   cy="15"   r="11" fill="#d62728"/>
    <circle cx="16.7" cy="39.2" r="11" fill="#2ca02c"/>
    <circle cx="29.4" cy="78.3" r="11" fill="#1f77b4"/>
    <circle cx="70.6" cy="78.3" r="11" fill="#d62728"/>
    <circle cx="83.3" cy="39.2" r="11" fill="#2ca02c"/>
  </g>
</svg>
