name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish Python Package
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write  # Required for PyPI trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3  # no major tags since v8: full version
        with:
          version: "0.13.6"  # latest uv whose checksum this setup-uv verifies

      - name: Build package
        run: uv build --no-sources  # Recommended for production builds

      - name: Publish to PyPI
        run: uv publish -v dist/*
