# This workflow will install the package with UV,
# run the tests on multiple Python versions,
# and upload the results on codecov.
name: build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '30 5 1,15 * *'
env:
  NUMBA_DISABLE_JIT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3  # no major tags since v8: full version
      with:
        version: "0.13.6"  # latest uv whose checksum this setup-uv verifies

    - name: Run tests
      run: |
        uv sync --all-extras
        uv run pytest

    - name: Upload coverage reports to Codecov with GitHub Action on Python 3.12
      uses: codecov/codecov-action@v7
      if: ${{ matrix.python-version == '3.12' }}
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }} # required
