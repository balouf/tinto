[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinto"
version = "0.1.1"
description = "How long does a self-stabilizing graph coloring take to settle? Tinto measures it with a Numba-compiled Monte Carlo over pluggable graphs, guards, schedulers and recoloring rules, down to the variance and skewness of the stabilization time. For the conflict-guard rule under the random central daemon, it also provides exact results."
readme = ".github/README.md"
requires-python = ">=3.10"
authors = [
    {name = "Fabien Mathieu", email = "fabien.mathieu@normalesup.org"}
]
maintainers = [
    {name = "Fabien Mathieu", email = "fabien.mathieu@normalesup.org"}
]
license = "MIT"
dependencies = [
    "numba>=0.65.0",
    "scipy>=1.15.3",
]

[project.urls]
Repository = "https://github.com/balouf/tinto"
Documentation = "https://balouf.github.io/tinto"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=8.35.0",
    "matplotlib>=3.8.0",
    "myst-parser[linkify]>=4.0.1",
    "nbsphinx>=0.9.7",
    "pydata-sphinx-theme>=0.16.1",
    "pytest-cov>=6.1.1",
    "ruff>=0.11.8",
    "sphinx-copybutton>=0.5.2",
    "sympy>=1.14.0",
    "tqdm>=4.66.0",
]


# This file sits at the root of a repository that also holds private material
# (papers, notes); the settings below name the package paths explicitly so that
# builds, tests and lint stay on them.
[tool.hatch.build.targets.sdist]
include = [
    "tinto/",
    "tests/",
    "docs/",
    ".github/README.md",
    "AUTHORS.md",
    "CONTRIBUTING.md",
    "HISTORY.md",
    "citation.cff",
    "conftest.py",
]

[tool.ruff]
include = [
    "tinto/**/*.py",
    "tests/**/*.py",
    "conftest.py",
    "docs/**/*.py",
    "docs/**/*.ipynb",
]

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["tinto"]

[tool.coverage.html]
directory = "cov"

[tool.pytest.ini_options]
testpaths = ["tinto", "tests"]
addopts = "--doctest-modules --cov --cov-config=pyproject.toml --cov-report xml --cov-report html --showlocals --capture=no --exitfirst --failed-first"
